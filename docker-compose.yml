# Everything runs in Docker (see README). Published ports are bound to 127.0.0.1 only.
name: proof-visualizer

x-node: &node
    image: node:22-bookworm-slim
    working_dir: /app/frontend
    volumes:
        - ./:/app
        # Linux node_modules; the host one (installed on Windows) must never be used
        - frontend_node_modules:/app/frontend/node_modules

services:
    bridge:
        build:
            context: ./bridge
            target: runtime
        ports:
            - '127.0.0.1:4000:4000'
        environment:
            BRIDGE_ALLOWED_HOSTS: localhost,127.0.0.1,bridge
            BRIDGE_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080

    # Vite dev server with hot reload
    frontend:
        <<: *node
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000 --strictPort"
        environment:
            BRIDGE_URL: http://bridge:4000
            VITE_POLLING: '1' # inotify does not cross the /mnt/c bind mount
        ports:
            - '127.0.0.1:3000:3000'
        depends_on:
            bridge:
                condition: service_healthy

    # Production build behind nginx
    web:
        build:
            context: ./frontend
            additional_contexts:
                # veriT wasm built by `make verit-wasm`; keeps ./wasm out of the frontend build context
                verit-dist: ./wasm/verit/dist
        ports:
            - '127.0.0.1:8080:80'
        profiles: [web]

    bridge-test:
        build:
            context: ./bridge
            target: test
            additional_contexts:
                fixtures: ./frontend/src/alethe/__fixtures__
        profiles: [test]

    frontend-test:
        <<: *node
        command: sh -c "npm ci && npm run typecheck && npx eslint . && npm test && npm run build"
        # Own volume so tests can run while the dev server is up
        volumes:
            - ./:/app
            - frontend_test_node_modules:/app/frontend/node_modules
        profiles: [test]

volumes:
    frontend_node_modules:
    frontend_test_node_modules:
